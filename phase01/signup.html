<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html,body{background-color:#0b0f19!important;color-scheme:dark;}</style>

    <title>Create Account | InventoryIQ System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Global & Auth CSS -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">

</head>

<body>

    <!-- DYNAMIC BACKGROUND ORBS & GRID -->
    <div class="auth-bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="auth-bg-grid"></div>

    <div class="auth-card signup-card">
        <!-- BRANDING LOGO -->
        <a href="dashboard.html" class="auth-logo">
            <div style="width: 44px; height: 44px;">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                  <defs>
                    <linearGradient id="auth-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#38bdf8"/>
                      <stop offset="100%" stop-color="#6366f1"/>
                    </linearGradient>
                  </defs>
                  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#auth-logo-grad)" />
                  <rect x="24" y="52" width="10" height="22" rx="3" fill="#ffffff" opacity="0.6" />
                  <rect x="42" y="40" width="10" height="34" rx="3" fill="#ffffff" opacity="0.8" />
                  <rect x="60" y="26" width="10" height="48" rx="3" fill="#ffffff" />
                  <path d="M 20 62 Q 38 48 55 36 T 80 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
                  <circle cx="80" cy="20" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
                </svg>
            </div>
            <h1>Inventory<span>IQ</span></h1>
        </a>

        <div style="text-align: center; margin-bottom: 28px;">
            <h2 style="margin: 0 0 6px; font-size: 22px; font-weight: 800; color: #ffffff;">Create Your Account</h2>
            <p style="margin: 0; font-size: 13.5px; color: #94a3b8;">Start forecasting, reordering & managing stock</p>
        </div>

        <div id="signupError" class="error-alert">
            <i class="ph ph-warning-circle" style="font-size: 18px;"></i>
            <span id="signupErrorMsg">Please complete all fields</span>
        </div>

        <form id="signupForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div class="form-group">
                    <label><i class="ph ph-user" style="color:#38bdf8;"></i> First Name</label>
                    <input type="text" id="signupFirstName" class="form-control" placeholder="Aman" required>
                </div>
                <div class="form-group">
                    <label><i class="ph ph-user" style="color:#38bdf8;"></i> Last Name</label>
                    <input type="text" id="signupLastName" class="form-control" placeholder="Sharma" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label><i class="ph ph-envelope-simple" style="color:#38bdf8;"></i> Business Email</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="name@company.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label><i class="ph ph-buildings" style="color:#38bdf8;"></i> Organization / Company</label>
                <input type="text" id="signupOrg" class="form-control" placeholder="InventoryIQ Systems" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px;">
                <div class="form-group">
                    <label><i class="ph ph-lock" style="color:#38bdf8;"></i> Password</label>
                    <input type="password" id="signupPass" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label><i class="ph ph-lock-key" style="color:#38bdf8;"></i> Confirm Password</label>
                    <input type="password" id="signupConfirmPass" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Password Strength Meter -->
            <div id="passwordStrengthBox" class="pwd-strength-box">
                <!-- Header Row -->
                <div class="pwd-strength-header">
                    <div class="pwd-strength-title">
                        <i class="ph ph-shield-check" style="font-size: 16px; color: #38bdf8;"></i>
                        <span>Password Strength</span>
                    </div>
                    <span id="strengthLabel" class="pwd-strength-label" data-level="weak">Weak</span>
                </div>

                <!-- Segmented Strength Bar (4 segments) -->
                <div class="pwd-bar-segments">
                    <div class="pwd-bar-seg" id="seg1"></div>
                    <div class="pwd-bar-seg" id="seg2"></div>
                    <div class="pwd-bar-seg" id="seg3"></div>
                    <div class="pwd-bar-seg" id="seg4"></div>
                </div>

                <!-- Rules Grid -->
                <div class="pwd-rules-grid">
                    <div class="pwd-rule" id="rule-length">
                        <i class="ph ph-circle"></i>
                        <span>Min 8 characters</span>
                    </div>
                    <div class="pwd-rule" id="rule-upper">
                        <i class="ph ph-circle"></i>
                        <span>Uppercase (A-Z)</span>
                    </div>
                    <div class="pwd-rule" id="rule-lower">
                        <i class="ph ph-circle"></i>
                        <span>Lowercase (a-z)</span>
                    </div>
                    <div class="pwd-rule" id="rule-number">
                        <i class="ph ph-circle"></i>
                        <span>Number (0-9)</span>
                    </div>
                    <div class="pwd-rule" id="rule-special">
                        <i class="ph ph-circle"></i>
                        <span>Special (!@#$...)</span>
                    </div>
                    <div class="pwd-rule" id="rule-match">
                        <i class="ph ph-circle"></i>
                        <span>Passwords match</span>
                    </div>
                </div>
            </div>

            <style>
                /* ==========================================
                   PASSWORD STRENGTH METER - PREMIUM DESIGN
                   ========================================== */
                .pwd-strength-box {
                    margin-bottom: 20px;
                    padding: 16px 18px 18px;
                    border-radius: 16px;
                    background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(20, 30, 55, 0.85) 100%);
                    border: 1px solid rgba(56, 189, 248, 0.12);
                    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.04);
                    backdrop-filter: blur(12px);
                    display: none;
                    overflow: hidden;
                    animation: pwdBoxSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
                }

                @keyframes pwdBoxSlideIn {
                    from {
                        opacity: 0;
                        transform: translateY(-8px);
                        max-height: 0;
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                        max-height: 300px;
                    }
                }

                /* Header */
                .pwd-strength-header {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    margin-bottom: 12px;
                }

                .pwd-strength-title {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    font-size: 12.5px;
                    font-weight: 700;
                    color: #cbd5e1;
                    text-transform: uppercase;
                    letter-spacing: 0.6px;
                }

                .pwd-strength-label {
                    font-size: 11.5px;
                    font-weight: 800;
                    text-transform: uppercase;
                    letter-spacing: 0.8px;
                    padding: 3px 10px;
                    border-radius: 99px;
                    transition: all 0.35s ease;
                }

                .pwd-strength-label[data-level="weak"] {
                    color: #fca5a5;
                    background: rgba(239, 68, 68, 0.15);
                    border: 1px solid rgba(239, 68, 68, 0.25);
                }

                .pwd-strength-label[data-level="medium"] {
                    color: #fde68a;
                    background: rgba(251, 191, 36, 0.15);
                    border: 1px solid rgba(251, 191, 36, 0.25);
                }

                .pwd-strength-label[data-level="strong"] {
                    color: #7dd3fc;
                    background: rgba(56, 189, 248, 0.15);
                    border: 1px solid rgba(56, 189, 248, 0.25);
                }

                .pwd-strength-label[data-level="excellent"] {
                    color: #6ee7b7;
                    background: rgba(52, 211, 153, 0.15);
                    border: 1px solid rgba(52, 211, 153, 0.25);
                }

                /* Segmented Bar */
                .pwd-bar-segments {
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 5px;
                    margin-bottom: 16px;
                }

                .pwd-bar-seg {
                    height: 4px;
                    border-radius: 99px;
                    background: rgba(255, 255, 255, 0.06);
                    transition: background 0.4s cubic-bezier(.4,0,.2,1), box-shadow 0.4s ease;
                }

                .pwd-bar-seg.active-weak {
                    background: #f87171;
                    box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
                }

                .pwd-bar-seg.active-medium {
                    background: #fbbf24;
                    box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
                }

                .pwd-bar-seg.active-strong {
                    background: #38bdf8;
                    box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
                }

                .pwd-bar-seg.active-excellent {
                    background: #34d399;
                    box-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
                }

                /* Rules Grid */
                .pwd-rules-grid {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 8px 20px;
                }

                .pwd-rule {
                    font-size: 12.5px;
                    font-weight: 500;
                    color: #475569;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    transition: all 0.3s ease;
                    padding: 4px 0;
                }

                .pwd-rule i {
                    font-size: 15px;
                    flex-shrink: 0;
                    transition: all 0.3s ease;
                }

                .pwd-rule.pass {
                    color: #34d399;
                }

                .pwd-rule.pass i {
                    color: #34d399;
                }

                .pwd-rule.fail {
                    color: #f87171;
                }

                .pwd-rule.fail i {
                    color: #f87171;
                }
            </style>

            <div style="margin-bottom: 24px; font-size: 13px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; color: #cbd5e1; cursor: pointer; line-height: 1.4;">
                    <input type="checkbox" required style="accent-color: #0284c7; width: 16px; height: 16px; margin-top: 2px;">
                    <span>I agree to the <a href="#" style="color:#38bdf8; text-decoration:none;">Terms of Service</a> and <a href="#" style="color:#38bdf8; text-decoration:none;">Privacy Policy</a></span>
                </label>
            </div>

            <button type="submit" class="btn-save" style="width: 100%; padding: 13px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);">
                <i class="ph ph-user-plus" style="font-size: 18px;"></i> Create Free Account
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13.5px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px;">
            Already have an account? <a href="login.html" style="color: #38bdf8; font-weight: 700; text-decoration: none;">Sign in</a>
        </div>
    </div>

    <!-- Storage Script -->
    <script src="./js/storage/storage.js"></script>
    <script>
        // ==========================================
        // PASSWORD VALIDATION ENGINE
        // ==========================================
        const passInput = document.getElementById('signupPass');
        const confirmInput = document.getElementById('signupConfirmPass');
        const strengthBox = document.getElementById('passwordStrengthBox');
        const strengthLabel = document.getElementById('strengthLabel');
        const segments = [
            document.getElementById('seg1'),
            document.getElementById('seg2'),
            document.getElementById('seg3'),
            document.getElementById('seg4')
        ];

        const rules = {
            length:  { el: document.getElementById('rule-length'),  test: (p) => p.length >= 8 },
            upper:   { el: document.getElementById('rule-upper'),   test: (p) => /[A-Z]/.test(p) },
            lower:   { el: document.getElementById('rule-lower'),   test: (p) => /[a-z]/.test(p) },
            number:  { el: document.getElementById('rule-number'),  test: (p) => /[0-9]/.test(p) },
            special: { el: document.getElementById('rule-special'), test: (p) => /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(p) },
            match:   { el: document.getElementById('rule-match'),   test: (p) => p.length > 0 && p === confirmInput.value }
        };

        function updateRule(ruleEl, passed) {
            const icon = ruleEl.querySelector('i');
            if (passed) {
                ruleEl.classList.add('pass');
                ruleEl.classList.remove('fail');
                icon.className = 'ph ph-check-circle';
            } else {
                ruleEl.classList.remove('pass');
                ruleEl.classList.add('fail');
                icon.className = 'ph ph-x-circle';
            }
        }

        function resetRule(ruleEl) {
            ruleEl.classList.remove('pass', 'fail');
            ruleEl.querySelector('i').className = 'ph ph-circle';
        }

        function updateSegments(passed, levelClass) {
            // Map passed count (0-6) to segments (0-4)
            let activeBars = 0;
            if (passed <= 0) activeBars = 0;
            else if (passed <= 2) activeBars = 1;
            else if (passed <= 4) activeBars = 2;
            else if (passed === 5) activeBars = 3;
            else activeBars = 4;

            segments.forEach((seg, i) => {
                seg.className = 'pwd-bar-seg'; // reset
                if (i < activeBars) {
                    seg.classList.add('active-' + levelClass);
                }
            });
        }

        function validatePassword() {
            const pass = passInput.value;
            const confirm = confirmInput.value;

            // Show/hide strength box
            if (pass.length > 0 || confirm.length > 0) {
                strengthBox.style.display = 'block';
            } else {
                strengthBox.style.display = 'none';
                Object.values(rules).forEach(r => resetRule(r.el));
                updateSegments(0, 'weak');
                strengthLabel.textContent = 'Weak';
                strengthLabel.setAttribute('data-level', 'weak');
                return;
            }

            let passed = 0;
            for (const key in rules) {
                const ok = rules[key].test(pass);
                updateRule(rules[key].el, ok);
                if (ok) passed++;
            }

            // Determine strength level
            let level, text;
            if (passed <= 2) {
                level = 'weak'; text = 'Weak';
            } else if (passed <= 4) {
                level = 'medium'; text = 'Medium';
            } else if (passed === 5) {
                level = 'strong'; text = 'Strong';
            } else {
                level = 'excellent'; text = 'Excellent';
            }

            strengthLabel.textContent = text;
            strengthLabel.setAttribute('data-level', level);
            updateSegments(passed, level);

            return passed === Object.keys(rules).length;
        }

        passInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validatePassword);

        // ==========================================
        // SIGNUP FORM SUBMIT
        // ==========================================
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('signupFirstName').value.trim();
            const lastName = document.getElementById('signupLastName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const org = document.getElementById('signupOrg').value.trim();
            const pass = document.getElementById('signupPass').value;
            const confirmPass = document.getElementById('signupConfirmPass').value;
            const errorAlert = document.getElementById('signupError');
            const errorMsg = document.getElementById('signupErrorMsg');

            // Hide previous error
            errorAlert.style.display = 'none';

            // Check all password rules
            const allRulesPassed = validatePassword();
            if (!allRulesPassed) {
                // Find which rules failed for error message
                const failedRules = [];
                if (!rules.length.test(pass)) failedRules.push('at least 8 characters');
                if (!rules.upper.test(pass)) failedRules.push('an uppercase letter');
                if (!rules.lower.test(pass)) failedRules.push('a lowercase letter');
                if (!rules.number.test(pass)) failedRules.push('a number');
                if (!rules.special.test(pass)) failedRules.push('a special character');
                if (pass !== confirmPass) failedRules.push('passwords must match');

                errorMsg.textContent = failedRules.length > 0
                    ? `Password needs: ${failedRules.join(', ')}`
                    : 'Please fix password requirements';
                errorAlert.style.display = 'flex';
                return;
            }

            const newUser = {
                id: "usr_" + Date.now(),
                firstName: firstName,
                lastName: lastName,
                email: email,
                password: pass,
                phone: "+91 98765 43210",
                organization: org,
                role: "System Administrator",
                avatar: (firstName[0] || 'A').toUpperCase(),
                createdAt: new Date().toISOString()
            };

            // Register new user in database
            const regResult = await registerNewUser(newUser);
            if (!regResult.success) {
                errorMsg.textContent = regResult.message;
                errorAlert.style.display = 'flex';
                return;
            }

            // Save active user session
            saveCurrentUser(regResult.user || newUser);

            // Redirect to dashboard
            window.location.href = "dashboard.html";
        });
    </script>
</body>

</html>
