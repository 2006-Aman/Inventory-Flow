<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventoryIQ | AI Inventory & Reorder Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020409;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ===== RADIAL GRADIENT BG ===== */
        .bg-radial {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 45%, rgba(14,165,233,0.06) 0%, rgba(99,102,241,0.03) 40%, transparent 70%);
            pointer-events: none;
        }

        /* ===== AMBIENT ORBS ===== */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            opacity: 0;
        }
        .orb-1 { width: 480px; height: 480px; top: -200px; left: -160px; background: #0284c7; animation: orbA 1.8s 0.2s ease forwards, orbF 20s 2s ease-in-out infinite alternate; }
        .orb-2 { width: 520px; height: 520px; bottom: -220px; right: -180px; background: #4f46e5; animation: orbA 1.8s 0.5s ease forwards, orbF 22s 2.3s ease-in-out infinite alternate; }
        .orb-3 { width: 380px; height: 380px; top: 50%; left: 55%; background: #059669; animation: orbA 1.8s 0.8s ease forwards, orbF 24s 2.6s ease-in-out infinite alternate; }

        @keyframes orbA { to { opacity: 0.28; } }
        @keyframes orbF {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -35px) scale(1.12); }
            100% { transform: translate(-35px, 50px) scale(0.92); }
        }

        /* ===== GRID ===== */
        .grid-bg {
            position: fixed; inset: 0;
            background-size: 52px 52px;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.022) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.022) 1px, transparent 1px);
            pointer-events: none;
            mask-image: radial-gradient(circle at 50% 48%, rgba(0,0,0,0.8) 20%, rgba(0,0,0,0) 70%);
            opacity: 0;
            animation: fadeIn 1.2s 0.4s ease forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        /* ===== SCENE ===== */
        .scene {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== LOGO ===== */
        .logo-assembly {
            position: relative;
            width: 88px;
            height: 88px;
            margin-bottom: 28px;
        }

        /* Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
            opacity: 0;
        }
        .ring-1 {
            inset: -14px;
            border-top-color: rgba(56,189,248,0.45);
            border-right-color: rgba(99,102,241,0.2);
            animation: ringAppear 0.5s 0.6s cubic-bezier(0.16,1,0.3,1) forwards, spinCW 2.8s 1.1s linear infinite;
        }
        .ring-2 {
            inset: -26px;
            border-bottom-color: rgba(16,185,129,0.3);
            border-left-color: rgba(139,92,246,0.2);
            animation: ringAppear 0.5s 0.8s cubic-bezier(0.16,1,0.3,1) forwards, spinCCW 4s 1.3s linear infinite;
        }
        .ring-3 {
            inset: -38px;
            border-right-color: rgba(251,191,36,0.15);
            border-bottom-color: rgba(56,189,248,0.1);
            animation: ringAppear 0.5s 1s cubic-bezier(0.16,1,0.3,1) forwards, spinCW 5.5s 1.5s linear infinite;
        }

        @keyframes ringAppear {
            from { opacity: 0; transform: scale(0.5) rotate(-120deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes spinCW { to { transform: rotate(360deg); } }
        @keyframes spinCCW { to { transform: rotate(-360deg); } }

        /* Core */
        .logo-core {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.4) rotate(-20deg);
            animation: coreAppear 0.65s 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 0 0 0 rgba(56,189,248,0.4);
        }

        .logo-core::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            border: 1.5px solid rgba(56,189,248,0.25);
            opacity: 0;
            animation: coreAppear 0.5s 0.8s ease forwards, borderPulse 3s 1.5s ease-in-out infinite;
        }

        @keyframes coreAppear {
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes borderPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.04); }
        }

        .logo-core svg {
            width: 40px;
            height: 40px;
            opacity: 0;
            animation: svgIn 0.4s 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        @keyframes svgIn {
            from { opacity: 0; transform: translateY(4px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glow behind logo */
        .logo-glow {
            position: absolute;
            inset: -20px;
            border-radius: 32px;
            background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 65%);
            opacity: 0;
            animation: glowIn 1s 0.6s ease forwards;
            pointer-events: none;
        }
        @keyframes glowIn { to { opacity: 1; } }

        /* Corner dots */
        .cdot {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            opacity: 0;
        }
        .cdot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: inherit;
            opacity: 0.4;
            animation: ping 2s 1.4s ease-in-out infinite;
        }
        .cdot-tl { top: -2px; left: -2px; background: #38bdf8; animation: dotIn 0.3s 0.9s ease forwards; }
        .cdot-tr { top: -2px; right: -2px; background: #818cf8; animation: dotIn 0.3s 1s ease forwards; }
        .cdot-br { bottom: -2px; right: -2px; background: #10b981; animation: dotIn 0.3s 1.1s ease forwards; }

        @keyframes dotIn {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes ping {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(2.2); opacity: 0; }
        }

        /* ===== BRAND TEXT ===== */
        .text-block {
            text-align: center;
            opacity: 0;
            transform: translateY(14px);
            animation: textUp 0.6s 0.95s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        @keyframes textUp { to { opacity: 1; transform: translateY(0); } }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .brand-name span { color: #38bdf8; }

        .tagline {
            font-size: 10px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-weight: 600;
            margin-top: 6px;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: textUp 0.5s 1.3s ease forwards;
        }

        /* Progress ring */
        .progress-ring {
            position: relative;
            width: 36px;
            height: 36px;
        }

        .progress-ring svg {
            width: 36px;
            height: 36px;
            transform: rotate(-90deg);
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .ring-bg { stroke: rgba(255,255,255,0.06); }

        .ring-progress {
            stroke: url(#progressGrad);
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawRing 2.6s 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes drawRing {
            to { stroke-dashoffset: 0; }
        }

        .progress-ring .ring-center-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring .ring-center-icon i {
            font-size: 14px;
            color: #38bdf8;
            opacity: 0;
            animation: iconIn 0.3s 1.6s ease forwards;
        }

        @keyframes iconIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Status text */
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #38bdf8;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(56,189,248,0.6); }
            50% { opacity: 0.25; box-shadow: none; }
        }

        .status-msg {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            min-width: 180px;
        }
        .status-msg b {
            color: #94a3b8;
            font-weight: 600;
        }
        .status-msg .ready {
            color: #10b981;
            font-weight: 700;
        }

        /* ===== SCREEN FLASH ===== */
        .flash {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
        }
        .flash.on {
            animation: flash 0.35s ease-out forwards;
        }
        @keyframes flash {
            0% { opacity: 0.5; background: #fff; }
            100% { opacity: 0; }
        }

        /* ===== SCENE EXIT ===== */
        .scene.exit {
            animation: exitScene 0.45s cubic-bezier(0.4, 0, 1, 0.4) forwards;
        }
        @keyframes exitScene {
            to { opacity: 0; transform: scale(0.93); filter: blur(6px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .brand-name { font-size: 22px; }
            .logo-assembly { width: 72px; height: 72px; }
            .logo-core svg { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <div class="bg-radial"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-bg"></div>

    <div class="flash" id="flash"></div>

    <div class="scene" id="scene">
        <div class="logo-assembly">
            <div class="logo-glow"></div>
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="cdot cdot-tl"></div>
            <div class="cdot cdot-tr"></div>
            <div class="cdot cdot-br"></div>
            <div class="logo-core">
                <svg viewBox="0 0 100 100" fill="none">
                    <rect x="24" y="52" width="10" height="22" rx="3" fill="#fff" opacity="0.6"/>
                    <rect x="42" y="40" width="10" height="34" rx="3" fill="#fff" opacity="0.8"/>
                    <rect x="60" y="26" width="10" height="48" rx="3" fill="#fff"/>
                    <path d="M20 62 Q38 48 55 36 T80 20" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
                    <circle cx="80" cy="20" r="6" fill="#38bdf8" stroke="#fff" stroke-width="2.5"/>
                </svg>
            </div>
        </div>

        <div class="text-block">
            <div class="brand-name">Inventory<span>IQ</span></div>
            <div class="tagline">Forecast &bull; Reorder &bull; Grow</div>
        </div>

        <div class="status-bar">
            <div class="progress-ring">
                <svg viewBox="0 0 36 36">
                    <defs>
                        <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#38bdf8"/>
                            <stop offset="50%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                    </defs>
                    <circle class="ring-bg" cx="18" cy="18" r="15.5"/>
                    <circle class="ring-progress" cx="18" cy="18" r="15.5"/>
                </svg>
                <div class="ring-center-icon">
                    <i class="ph-bold ph-lightning"></i>
                </div>
            </div>

            <div class="status-row">
                <div class="status-dot"></div>
                <div class="status-msg" id="statusMsg">Booting <b>Engine v2.4</b></div>
            </div>
        </div>
    </div>

    <script>
        // If splash already shown this session, skip animation & redirect instantly
        if (sessionStorage.getItem('iq_splash_seen')) {
            let dest = 'login.html';
            try {
                const r = localStorage.getItem('inventory_current_user');
                if (r && JSON.parse(r)) dest = 'dashboard.html';
            } catch(e) {}
            window.location.href = dest;
        }

        // Mark splash as seen for this session
        sessionStorage.setItem('iq_splash_seen', '1');

        // Cycle status messages
        const msgs = [
            { t: 'Booting ', h: 'Engine v2.4' },
            { t: 'Loading ', h: 'Forecast Models' },
            { t: 'Syncing ', h: 'Inventory Data' },
            { t: 'Preparing ', h: 'Dashboard' },
            { t: '', h: '', ready: true }
        ];
        const el = document.getElementById('statusMsg');
        let i = 0;
        const timer = setInterval(() => {
            if (i >= msgs.length) { clearInterval(timer); return; }
            const m = msgs[i];
            if (m.ready) {
                el.innerHTML = '<span class="ready">All Systems Ready</span>';
            } else {
                el.innerHTML = m.t + '<b>' + m.h + '</b>';
            }
            i++;
        }, 600);

        // Auth check
        let loggedIn = false;
        try {
            const r = localStorage.getItem('inventory_current_user');
            if (r && JSON.parse(r)) loggedIn = true;
        } catch(e) {}

        const dest = loggedIn ? 'dashboard.html' : 'login.html';

        // Exit
        setTimeout(() => {
            document.getElementById('flash').classList.add('on');
            document.getElementById('scene').classList.add('exit');
            setTimeout(() => { window.location.href = dest; }, 400);
        }, 3400);
    </script>
</body>
</html>
