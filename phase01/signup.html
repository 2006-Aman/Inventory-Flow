<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html,body{background-color:#0b0f19!important;color-scheme:dark;}</style>

    <title>Create Account | InventoryIQ System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #111d38 0%, #0b0f19 80%);
            margin: 0;
            padding: 32px 24px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(135deg, rgba(13, 20, 36, 0.95) 0%, rgba(18, 30, 54, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            box-sizing: border-box;
            animation: authFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .auth-logo h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .auth-logo h1 span {
            color: #38bdf8;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <!-- BRANDING LOGO -->
        <a href="dashboard.html" class="auth-logo">
            <div style="width: 44px; height: 44px;">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                  <defs>
                    <linearGradient id="auth-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#38bdf8"/>
                      <stop offset="100%" stop-color="#6366f1"/>
                    </linearGradient>
                  </defs>
                  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#auth-logo-grad)" />
                  <rect x="24" y="52" width="10" height="22" rx="3" fill="#ffffff" opacity="0.6" />
                  <rect x="42" y="40" width="10" height="34" rx="3" fill="#ffffff" opacity="0.8" />
                  <rect x="60" y="26" width="10" height="48" rx="3" fill="#ffffff" />
                  <path d="M 20 62 Q 38 48 55 36 T 80 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
                  <circle cx="80" cy="20" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
                </svg>
            </div>
            <h1>Inventory<span>IQ</span></h1>
        </a>

        <div style="text-align: center; margin-bottom: 28px;">
            <h2 style="margin: 0 0 6px; font-size: 22px; font-weight: 800; color: #ffffff;">Create Your Account</h2>
            <p style="margin: 0; font-size: 13.5px; color: #94a3b8;">Start forecasting, reordering & managing stock</p>
        </div>

        <div id="signupError" class="error-alert">
            <i class="ph ph-warning-circle" style="font-size: 18px;"></i>
            <span id="signupErrorMsg">Please complete all fields</span>
        </div>

        <form id="signupForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div class="form-group">
                    <label><i class="ph ph-user" style="color:#38bdf8;"></i> First Name</label>
                    <input type="text" id="signupFirstName" class="form-control" placeholder="Aman" required>
                </div>
                <div class="form-group">
                    <label><i class="ph ph-user" style="color:#38bdf8;"></i> Last Name</label>
                    <input type="text" id="signupLastName" class="form-control" placeholder="Sharma" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label><i class="ph ph-envelope-simple" style="color:#38bdf8;"></i> Business Email</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="name@company.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label><i class="ph ph-buildings" style="color:#38bdf8;"></i> Organization / Company</label>
                <input type="text" id="signupOrg" class="form-control" placeholder="InventoryIQ Systems" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                <div class="form-group">
                    <label><i class="ph ph-lock" style="color:#38bdf8;"></i> Password</label>
                    <input type="password" id="signupPass" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label><i class="ph ph-lock-key" style="color:#38bdf8;"></i> Confirm Password</label>
                    <input type="password" id="signupConfirmPass" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div style="margin-bottom: 24px; font-size: 13px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; color: #cbd5e1; cursor: pointer; line-height: 1.4;">
                    <input type="checkbox" required style="accent-color: #0284c7; width: 16px; height: 16px; margin-top: 2px;">
                    <span>I agree to the <a href="#" style="color:#38bdf8; text-decoration:none;">Terms of Service</a> and <a href="#" style="color:#38bdf8; text-decoration:none;">Privacy Policy</a></span>
                </label>
            </div>

            <button type="submit" class="btn-save" style="width: 100%; padding: 13px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);">
                <i class="ph ph-user-plus" style="font-size: 18px;"></i> Create Free Account
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13.5px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px;">
            Already have an account? <a href="login.html" style="color: #38bdf8; font-weight: 700; text-decoration: none;">Sign in</a>
        </div>
    </div>

    <!-- Storage Script -->
    <script src="./js/storage/storage.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const firstName = document.getElementById('signupFirstName').value.trim();
            const lastName = document.getElementById('signupLastName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const org = document.getElementById('signupOrg').value.trim();
            const pass = document.getElementById('signupPass').value;
            const confirmPass = document.getElementById('signupConfirmPass').value;
            const errorAlert = document.getElementById('signupError');
            const errorMsg = document.getElementById('signupErrorMsg');

            if (pass !== confirmPass) {
                errorMsg.textContent = "Passwords do not match!";
                errorAlert.style.display = 'flex';
                return;
            }

            const newUser = {
                id: "usr_" + Date.now(),
                firstName: firstName,
                lastName: lastName,
                email: email,
                password: pass,
                phone: "+91 98765 43210",
                organization: org,
                role: "System Administrator",
                avatar: (firstName[0] || 'A').toUpperCase(),
                createdAt: new Date().toISOString()
            };

            // Register new user in database
            const regResult = registerNewUser(newUser);
            if (!regResult.success) {
                errorMsg.textContent = regResult.message;
                errorAlert.style.display = 'flex';
                return;
            }

            // Save active user session
            saveCurrentUser(newUser);

            // Redirect to dashboard
            window.location.href = "dashboard.html";
        });
    </script>
</body>

</html>
