<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html,body{background-color:#0b0f19!important;color-scheme:dark;}</style>

    <title>Sign In | InventoryIQ System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #111d38 0%, #0b0f19 80%);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(135deg, rgba(13, 20, 36, 0.95) 0%, rgba(18, 30, 54, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            box-sizing: border-box;
            animation: authFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .auth-logo h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .auth-logo h1 span {
            color: #38bdf8;
        }

        .password-field-wrapper {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

        .password-toggle-btn:hover {
            color: #38bdf8;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <!-- BRANDING LOGO -->
        <a href="dashboard.html" class="auth-logo">
            <div style="width: 44px; height: 44px;">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                  <defs>
                    <linearGradient id="auth-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#38bdf8"/>
                      <stop offset="100%" stop-color="#6366f1"/>
                    </linearGradient>
                  </defs>
                  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#auth-logo-grad)" />
                  <rect x="24" y="52" width="10" height="22" rx="3" fill="#ffffff" opacity="0.6" />
                  <rect x="42" y="40" width="10" height="34" rx="3" fill="#ffffff" opacity="0.8" />
                  <rect x="60" y="26" width="10" height="48" rx="3" fill="#ffffff" />
                  <path d="M 20 62 Q 38 48 55 36 T 80 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
                  <circle cx="80" cy="20" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
                </svg>
            </div>
            <h1>Inventory<span>IQ</span></h1>
        </a>

        <div style="text-align: center; margin-bottom: 28px;">
            <h2 style="margin: 0 0 6px; font-size: 22px; font-weight: 800; color: #ffffff;">Welcome Back</h2>
            <p style="margin: 0; font-size: 13.5px; color: #94a3b8;">Sign in to your account to continue</p>
        </div>

        <div id="loginError" class="error-alert">
            <i class="ph ph-warning-circle" style="font-size: 18px;"></i>
            <span id="loginErrorMsg">Invalid email or password</span>
        </div>

        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 20px;">
                <label><i class="ph ph-envelope-simple" style="color:#38bdf8;"></i> Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="admin@inventoryflow.com" value="admin@inventoryflow.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display:flex; justify-content:space-between; align-items:center;">
                    <span><i class="ph ph-lock" style="color:#38bdf8;"></i> Password</span>
                    <a href="#" style="color:#38bdf8; font-size:12px; text-decoration:none; font-weight:500;">Forgot?</a>
                </label>
                <div class="password-field-wrapper">
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="admin123" required style="padding-right: 44px;">
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Show/Hide Password">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 13px;">
                <label style="display: flex; align-items: center; gap: 8px; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" checked style="accent-color: #0284c7; width: 16px; height: 16px;"> Remember me
                </label>
            </div>

            <button type="submit" class="btn-save" style="width: 100%; padding: 13px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);">
                <i class="ph ph-sign-in" style="font-size: 18px;"></i> Sign In to Dashboard
            </button>
        </form>

        <div style="margin-top: 28px; text-align: center; font-size: 13.5px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px;">
            Don't have an account? <a href="signup.html" style="color: #38bdf8; font-weight: 700; text-decoration: none;">Create an account</a>
        </div>
    </div>

    <!-- Storage Script -->
    <script src="./js/storage/storage.js"></script>
    <script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('loginPassword');
        const toggleBtn = document.getElementById('togglePasswordBtn');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = isPassword ? '<i class="ph ph-eye-slash"></i>' : '<i class="ph ph-eye"></i>';
        });

        // Form Submit Authentication
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorAlert = document.getElementById('loginError');
            const errorMsg = document.getElementById('loginErrorMsg');

            if (!email || !password) {
                if (errorMsg) errorMsg.textContent = "Please enter both email and password!";
                errorAlert.style.display = 'flex';
                return;
            }

            // Real authentication check against registered users database
            const authResult = await authenticateUser(email, password);

            if (!authResult.success) {
                if (errorMsg) errorMsg.textContent = authResult.message;
                errorAlert.style.display = 'flex';
                return;
            }

            // Save active session
            saveCurrentUser(authResult.user);

            // Redirect to dashboard
            window.location.href = "dashboard.html";
        });
    </script>
</body>

</html>
